<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CR Chantier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concept : carnet de chantier. Papier technique gris-bleu, encre bleu de plan, signalétique condensée. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --ink:#13232C; --muted:#586972; --line:#D2DAE0; --soft:#E4EAEE;
  --accent:#0A5A78; --accent-ink:#FFFFFF; --accent-soft:#DCEBF2;
  --ok:#1E7A4A; --warn:#9A5B00; --bad:#B3261E;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1419; --surface:#131E25; --ink:#E5ECF0; --muted:#8FA2AD; --line:#243540; --soft:#1B2A33;
    --accent:#58B8DD; --accent-ink:#04212D; --accent-soft:#14323F;
    --ok:#5CC48B; --warn:#E3A44A; --bad:#F28B82; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1419; --surface:#131E25; --ink:#E5ECF0; --muted:#8FA2AD; --line:#243540; --soft:#1B2A33;
  --accent:#58B8DD; --accent-ink:#04212D; --accent-soft:#14323F;
  --ok:#5CC48B; --warn:#E3A44A; --bad:#F28B82; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px 0}
.brand{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:12px;height:12px;background:var(--accent);box-shadow:4px 4px 0 var(--accent-soft)}
.proj{display:flex;gap:8px;align-items:center;min-width:0}
.proj select{min-width:0;max-width:60vw;padding:7px 28px 7px 10px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs a{padding:10px 14px 9px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-family:var(--font-mono);text-align:center}
.badge:empty{display:none}

main{padding-block:22px 80px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:30px;font-weight:700;letter-spacing:.01em}
h3{font-size:19px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 11px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;border-radius:4px}
.x:hover{color:var(--bad)}

/* Champs */
.in,textarea.in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
.in:hover{border-color:var(--muted)}
textarea.in{resize:vertical;line-height:1.55;min-height:96px}
.in.big{font-family:var(--font-display);font-size:30px;font-weight:700;padding:4px 0;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;line-height:1.15}
.in.big:focus{border-bottom-color:var(--accent);outline:0}
input[type=date].in{font-family:var(--font-mono);font-size:13px}
fieldset{border:0;margin:0;padding:0;min-width:0}

/* Listes de réunions */
.list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 14px 12px 12px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.mrow:hover{border-color:var(--accent)}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:56px;background:var(--accent-soft);border-radius:3px;font-family:var(--font-display);line-height:1}
.stamp b{font-size:28px;font-weight:700}
.stamp i{font-style:normal;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mtitle{display:block;font-weight:600;overflow-wrap:anywhere}
.mmeta{display:block;color:var(--muted);font-size:13px;font-family:var(--font-mono)}
.mstat{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-align:right}
.late{color:var(--bad);font-weight:500}

.empty{margin-top:22px;padding:28px 20px;border:1.5px dashed var(--line);border-radius:4px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.empty strong{color:var(--ink);font-family:var(--font-display);font-size:22px;font-weight:600}
.note{margin:14px 0 0;padding:9px 12px;border-left:3px solid var(--warn);background:var(--soft);font-size:13px}

/* Éditeur */
.sec{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.meta-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:10px}
.meta-row input[type=date]{width:auto}
.saved{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:10px;padding:4px 0}
.pname{flex:1;min-width:0;overflow-wrap:anywhere}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:2px 12px;font-size:13px;min-width:74px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.off{color:var(--muted);text-decoration:line-through}
.add{display:flex;gap:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.phimg{display:block;border:1px solid var(--line);padding:0;background:var(--soft);border-radius:4px;overflow:hidden;aspect-ratio:4/3}
.phimg img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{align-self:flex-end;font-size:13px;padding:0 4px}

.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.act .what{flex:1 1 100%}
.act .who{flex:1 1 140px}
.act .lot{flex:1 1 120px}
.act .due{flex:0 1 150px}
.st{border:1px solid var(--line);border-radius:12px;padding:2px 12px;font-size:12.5px;background:var(--surface);white-space:nowrap;min-width:80px}
.st-todo{color:var(--muted)}
.st-doing{color:var(--warn);border-color:var(--warn)}
.st-done{color:var(--ok);border-color:var(--ok)}

/* Actions */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 14px;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.counts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.arow{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.arow.done .atext{text-decoration:line-through;color:var(--muted)}
.atext{overflow-wrap:anywhere}
.ameta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);font-family:var(--font-mono)}
.ameta button{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font:inherit}

/* Recherche */
.search{margin-top:14px;font-size:17px;padding:11px 12px}
.res{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.res:hover{border-color:var(--accent)}
.res .snip{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
mark{background:var(--accent-soft);color:var(--ink);border-bottom:2px solid var(--accent);padding:0 1px}

/* Visionneuse et message */
.box{position:fixed;inset:0;z-index:20;background:rgba(5,10,13,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px))}
.box img{max-width:100%;max-height:78vh;border-radius:4px}
.box p{color:#fff;margin:0;max-width:60ch;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;max-width:calc(100vw - 32px);font-size:14px}
.toast[hidden]{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
@media (max-width:520px){
  .mrow{grid-template-columns:52px 1fr}
  .mstat{grid-column:2;text-align:left}
  .in.big{font-size:26px}
}
</style>
</head><body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">CR Chantier</div>
      <div class="proj">
        <select id="projectSelect" aria-label="Projet"></select>
        <button class="btn small" id="projBtn" type="button">Projets</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#reunions" data-r="reunions">Réunions</a>
      <a href="#actions" data-r="actions">Actions<span class="badge" id="lateBadge"></span></a>
      <a href="#recherche" data-r="recherche">Recherche</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<datalist id="dl-lots">
  <option value="Menuiserie"><option value="Électricité"><option value="Plomberie"><option value="CVC">
  <option value="Cloisons"><option value="Faux plafonds"><option value="Peinture"><option value="Sols">
  <option value="Serrurerie"><option value="Vitrerie"><option value="Mobilier"><option value="Éclairage">
</datalist>
<datalist id="dl-people"></datalist>

<script>
(function(){
'use strict';

/* ---------- Utilitaires ---------- */
function h(tag, props){
  var e = document.createElement(tag), val;
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') val = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  if (val !== undefined) e.value = val;
  return e;
}
function add(e, c){
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ add(e, x); }); return; }
  e.append(c.nodeType ? c : document.createTextNode(String(c)));
}
var $ = function(s){ return document.querySelector(s); };
var pad = function(n){ return String(n).padStart(2,'0'); };
function todayStr(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(s){
  if (!s) return '—';
  var d = new Date(s + 'T12:00:00'); if (isNaN(d)) return s;
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fold(s){
  return Array.from(String(s || '')).map(function(c){
    return (c.charCodeAt(0) < 128 || c.length > 1) ? c : c.normalize('NFD')[0];
  }).join('').toLowerCase();
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function lines(s){ return String(s || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); }
function pref(k, v){
  try { if (v === undefined) return localStorage.getItem('crc.' + k); localStorage.setItem('crc.' + k, v); } catch(e) {}
  return null;
}
var toastTimer;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 3800);
}
function grow(t){ t.style.height = 'auto'; t.style.height = Math.max(96, t.scrollHeight + 2) + 'px'; }

/* ---------- État et stockage ---------- */
var STATUS = {todo:'À faire', doing:'En cours', done:'Fait'};
var NEXT = {todo:'doing', doing:'done', done:'todo'};
var S = {projects:[], meetings:[], loading:true, slow:false, mode:'local', readonly:false,
         projectId:null, openId:null, adding:false, filter:'open', allProjects:false, aq:'', q:''};
var DB = null, ASSETS = null, SAMPLE = null, DL = null;
var cur = null, saveTimer = null;
var queues = {};

function loadLocal(){
  try {
    var d = JSON.parse(localStorage.getItem('crc.data') || 'null');
    if (d) { S.projects = d.projects || []; S.meetings = d.meetings || []; }
  } catch(e) {}
}
function saveLocal(){ try { localStorage.setItem('crc.data', JSON.stringify({projects:S.projects, meetings:S.meetings})); } catch(e) {} }
function writeError(e){
  var c = e && e.code;
  if (c === 'quota_exceeded') toast('Espace de stockage plein. Supprime d’anciens éléments.');
  else if (c === 'invalid_argument') toast('Modification refusée : ton accès est en lecture seule.');
  else toast('Enregistrement impossible pour le moment. Réessaie.');
}
function enqueue(path, fn){
  queues[path] = (queues[path] || Promise.resolve()).then(fn).catch(writeError);
}
function listOf(col){ return col === 'projects' ? S.projects : S.meetings; }
function persist(col, obj){
  var arr = listOf(col), i = arr.findIndex(function(x){ return x.id === obj.id; });
  if (i < 0) arr.push(obj); else arr[i] = obj;
  if (DB) {
    var data = JSON.parse(JSON.stringify(obj)); delete data.id;
    var path = col + '/' + obj.id;
    enqueue(path, function(){ return DB.doc(path).set(data); });
  } else saveLocal();
}
function removeDoc(col, id){
  var arr = listOf(col), i = arr.findIndex(function(x){ return x.id === id; });
  if (i >= 0) arr.splice(i, 1);
  if (DB) { var path = col + '/' + id; enqueue(path, function(){ return DB.doc(path).delete(); }); }
  else saveLocal();
}

/* ---------- Données dérivées ---------- */
function projName(id){ var p = S.projects.find(function(x){ return x.id === id; }); return p ? p.name : '—'; }
function meetingsOf(pid){ return S.meetings.filter(function(m){ return m.projectId === pid; }); }
function cmpAsc(a,b){ return (a.date || '').localeCompare(b.date || '') || (a.createdAt || 0) - (b.createdAt || 0); }
function numberOf(m){
  var l = meetingsOf(m.projectId).sort(cmpAsc);
  return l.findIndex(function(x){ return x.id === m.id; }) + 1;
}
function crNo(m){ return 'CR n° ' + pad(numberOf(m)); }
function isLate(a){ return !!a.due && a.due < todayStr() && a.status !== 'done'; }
function allActions(scopeAll){
  var out = [];
  S.meetings.forEach(function(m){
    if (!scopeAll && m.projectId !== S.projectId) return;
    (m.actions || []).forEach(function(a){ out.push({a:a, m:m}); });
  });
  return out;
}
function ensureProject(){
  if (S.projectId && S.projects.some(function(p){ return p.id === S.projectId; })) return;
  var sorted = S.projects.slice().sort(function(a,b){ return a.name.localeCompare(b.name, 'fr'); });
  var saved = pref('project');
  var ok = sorted.find(function(p){ return p.id === saved; });
  S.projectId = ok ? ok.id : (sorted[0] ? sorted[0].id : null);
}

/* ---------- Navigation ---------- */
var ROUTES = ['reunions','actions','recherche'];
function route(){ var r = (location.hash || '').replace('#',''); return ROUTES.indexOf(r) >= 0 ? r : 'reunions'; }
function leaveEditor(){ flushSave(); S.openId = null; cur = null; }
function openMeeting(id){
  var m = S.meetings.find(function(x){ return x.id === id; });
  if (!m) return;
  flushSave(); cur = m; S.openId = id; render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', function(){ leaveEditor(); render(); });
$('#tabs').addEventListener('click', function(e){
  var a = e.target.closest('a'); if (!a) return;
  if (S.openId) { leaveEditor(); if (location.hash === a.getAttribute('href')) render(); }
});
$('#projectSelect').addEventListener('change', function(e){
  S.projectId = e.target.value; pref('project', S.projectId); leaveEditor(); render();
});
$('#projBtn').addEventListener('click', function(){ leaveEditor(); S.adding = !S.adding; render(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { closeBox(); if (S.adding) { S.adding = false; render(); } }
});

/* ---------- Rendu ---------- */
function chrome(){
  var sel = $('#projectSelect');
  sel.replaceChildren.apply(sel, S.projects.slice().sort(function(a,b){ return a.name.localeCompare(b.name, 'fr'); }).map(function(p){
    return h('option', {value:p.id, text:p.name});
  }));
  if (!S.projects.length) sel.append(h('option', {value:'', text:'Aucun projet'}));
  sel.value = S.projectId || '';
  var r = route();
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.dataset.r === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  var late = allActions(false).filter(function(x){ return isLate(x.a); }).length;
  $('#lateBadge').textContent = late ? String(late) : '';
  var names = {};
  S.meetings.forEach(function(m){ (m.participants || []).forEach(function(p){ names[p.name] = 1; }); });
  var dl = $('#dl-people');
  dl.replaceChildren.apply(dl, Object.keys(names).sort().map(function(n){ return h('option', {value:n}); }));
}
function render(){
  ensureProject(); chrome();
  var main = $('#main'); main.replaceChildren();
  if (S.loading) { main.append(h('p', {class:'hint', text: S.slow ? 'Les données sont injoignables pour l’instant. Elles apparaîtront dès que la connexion revient.' : 'Chargement…'})); return; }
  if (S.readonly) main.append(h('p', {class:'note', text:'Lecture seule : ton accès ne permet pas de modifier les données.'}));
  if (S.adding) { main.append(viewProjects()); return; }
  if (S.openId && cur) { main.append(viewMeeting(cur)); return; }
  var r = route();
  main.append(r === 'actions' ? viewActions() : r === 'recherche' ? viewSearch() : viewList());
}
function softRender(){
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#main').contains(a)) { chrome(); return; }
  if (S.openId) { chrome(); return; }
  render();
}

/* ---------- Projets ---------- */
function viewProjects(){
  var input = h('input', {class:'in', id:'newProjName', placeholder:'Nom du projet (ex. Boutique Les Arcades)', maxlength:'80'});
  function create(ev){
    if (ev) ev.preventDefault();
    var name = input.value.trim(); if (!name) { input.focus(); return; }
    var p = {id:uid(), name:name, createdAt:Date.now()};
    persist('projects', p); S.projectId = p.id; pref('project', p.id); S.adding = false; render();
  }
  var cp = S.projects.find(function(p){ return p.id === S.projectId; });
  var delBtn;
  if (cp && !S.readonly) {
    var armed = false;

  return wrap;
}

/* ---------- Recherche ---------- */
function highlight(text, tokens){
  var f = fold(text), marks = [];
  tokens.forEach(function(t){ var i = f.indexOf(t); while (i >= 0) { marks.push([i, i + t.length]); i = f.indexOf(t, i + t.length); } });
  marks.sort(function(a,b){ return a[0] - b[0]; });
  var out = [], pos = 0;
  marks.forEach(function(mk){
    if (mk[0] < pos) return;
    out.push(text.slice(pos, mk[0])); out.push(h('mark', {text:text.slice(mk[0], mk[1])})); pos = mk[1];
  });
  out.push(text.slice(pos)); return out;
}
function snippet(text, tokens){
  var f = fold(text), best = -1;
  tokens.forEach(function(t){ var i = f.indexOf(t); if (i >= 0 && (best < 0 || i < best)) best = i; });
  var a = Math.max(0, best - 50), b = Math.min(text.length, best + 110);
  return (a > 0 ? '…' : '') + text.slice(a, b) + (b < text.length ? '…' : '');
}
function viewSearch(){
  var wrap = h('div');
  var out = h('div', {class:'list', 'aria-live':'polite'});
  var input = h('input', {class:'in search', type:'search', id:'q', value:S.q, placeholder:'Mot-clé : cloison, Karoui, réservation, livraison…', 'aria-label':'Rechercher', oninput:function(e){ S.q = e.target.value; run(); }});
  function run(){
    out.replaceChildren();
    var tokens = fold(S.q.trim()).split(/\s+/).filter(function(t){ return t.length > 1; });
    if (!tokens.length) { out.append(h('p', {class:'hint', text:'Cherche dans les titres, notes, comptes rendus, participants, légendes de photos et actions de tous tes projets.'})); return; }
    var n = 0;
    S.meetings.slice().sort(function(a,b){ return cmpAsc(b,a); }).forEach(function(m){
      var fields = [['Titre', m.title], ['Notes', m.notes], ['Points abordés', m.points], ['Décisions', m.decisions],
        ['Participants', (m.participants || []).map(function(p){ return p.name; }).join(', ')],
        ['Photos', (m.photos || []).map(function(p){ return p.caption; }).filter(Boolean).join(' · ')]];
      (m.actions || []).forEach(function(a){ fields.push(['Action', [a.what, a.who, a.lot].filter(Boolean).join(' · ')]); });
      var all = fold(fields.map(function(f){ return f[1] || ''; }).join(' \n '));
      if (!tokens.every(function(t){ return all.indexOf(t) >= 0; })) return;
      var hit = fields.find(function(f){ return f[1] && tokens.some(function(t){ return fold(f[1]).indexOf(t) >= 0; }); });
      n++;
      out.append(h('button', {type:'button', class:'res', onclick:function(){ S.projectId = m.projectId; openMeeting(m.id); }},
        h('span', {class:'mtitle'}, highlight(m.title || 'Réunion sans titre', tokens)),
        h('span', {class:'mmeta', text:projName(m.projectId) + ' · ' + crNo(m) + ' · ' + fmtDate(m.date)}),
        hit ? h('span', {class:'snip'}, h('b', {text:hit[0] + ' : '}), highlight(snippet(hit[1], tokens), tokens)) : null));
    });
    if (!n) out.append(h('p', {class:'hint', text:'Aucun résultat pour « ' + S.q.trim() + ' ».'}));
  }
  wrap.append(h('div', null, h('div', {class:'eyebrow', text:'Tous les projets'}), h('h2', {text:'Recherche'})), input, out);
  run();
  setTimeout(function(){ if (!S.q) input.focus(); }, 0);
  return wrap;
}

/* ---------- Exports ---------- */
function sections(m){
  var present = (m.participants || []).filter(function(p){ return p.present; }).map(function(p){ return p.name; });
  var absent = (m.participants || []).filter(function(p){ return !p.present; }).map(function(p){ return p.name; });
  return {present:present, absent:absent, points:lines(m.points), decisions:lines(m.decisions), actions:(m.actions || []).filter(function(a){ return a.what; })};
}
function exportMd(m){
  var s = sections(m), o = [];
  o.push('# ' + (m.title || 'Compte rendu') + ' — ' + crNo(m), '', '**Projet :** ' + projName(m.projectId) + '  ', '**Date :** ' + fmtDate(m.date), '');
  o.push('## Participants', '', 'Présents : ' + (s.present.join(', ') || '—'), '', 'Absents : ' + (s.absent.join(', ') || '—'), '');
  if (s.points.length) o.push('## Points abordés', '', s.points.map(function(x){ return '- ' + x; }).join('\n'), '');
  if (s.decisions.length) o.push('## Décisions', '', s.decisions.map(function(x){ return '- ' + x; }).join('\n'), '');
  if (s.actions.length) {
    o.push('## Actions', '', '| Action | Responsable | Lot | Échéance | Statut |', '|---|---|---|---|---|');
    s.actions.forEach(function(a){ o.push('| ' + [a.what, a.who || '—', a.lot || '—', a.due ? fmtDate(a.due) : '—', STATUS[a.status]].join(' | ') + ' |'); });
    o.push('');
  }
  var caps = (m.photos || []).map(function(p, i){ return '- Photo ' + (i+1) + (p.caption ? ' : ' + p.caption : ''); });
  if (caps.length) o.push('## Photos', '', caps.join('\n'), '');
  saveFile(slug(m) + '.md', o.join('\n'));
}
function slug(m){ return 'CR-' + pad(numberOf(m)) + '-' + (m.date || todayStr()); }
function saveFile(name, data){
  DL.save({filename:name, data:data}).then(function(){ toast('Fichier enregistré.'); }).catch(function(e){
    if (e && (e.code === 'declined' || /cancel/i.test(String(e.message || '')))) return;
    toast('Le téléchargement n’a pas abouti.');
  });
}
function photoData(id){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      try {
        var s = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.72));
      } catch(e) { res(null); }
    };
    img.onerror = function(){ res(null); };
    photoURL(id).then(function(u){ if (u) img.src = u; else res(null); });
  });
}
function exportHtml(m, btn){
  var s = sections(m);
  btn.disabled = true;
  Promise.all((m.photos || []).map(function(p){ return photoData(p.id); })).then(function(imgs){
    var css = 'body{font:14px/1.5 Arial,sans-serif;color:#13232C;max-width:780px;margin:32px auto;padding:0 20px}h1{font-size:24px;margin:0}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:#0A5A78;border-bottom:2px solid #0A5A78;padding-bottom:4px;margin-top:28px}.m{color:#586972}table{border-collapse:collapse;width:100%}th,td{border:1px solid #C9D2D8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#E4EAEE}.ph{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ph figure{margin:0}.ph img{width:100%;border:1px solid #C9D2D8}.ph figcaption{font-size:12px;color:#586972}.late{color:#B3261E}';
    function ul(a){ return a.length ? '<ul>' + a.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p class="m">—</p>'; }
    var h1 = '<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>' + esc(slug(m)) + '</title><style>' + css + '</style></head><body>';
    h1 += '<p class="m">' + esc(projName(m.projectId)) + ' · ' + esc(crNo(m)) + '</p><h1>' + esc(m.title || 'Compte rendu') + '</h1><p class="m">' + esc(fmtDate(m.date)) + '</p>';
    h1 += '<h2>Participants</h2><p><b>Présents :</b> ' + esc(s.present.join(', ') || '—') + '<br><b>Absents :</b> ' + esc(s.absent.join(', ') || '—') + '</p>';
    h1 += '<h2>Points abordés</h2>' + ul(s.points) + '<h2>Décisions</h2>' + ul(s.decisions);
    h1 += '<h2>Actions</h2>';
    h1 += s.actions.length ? '<table><tr><th>Action</th><th>Responsable</th><th>Lot</th><th>Échéance</th><th>Statut</th></tr>' + s.actions.map(function(a){
      return '<tr><td>' + esc(a.what) + '</td><td>' + esc(a.who || '—') + '</td><td>' + esc(a.lot || '—') + '</td><td class="' + (isLate(a) ? 'late' : '') + '">' + esc(a.due ? fmtDate(a.due) : '—') + '</td><td>' + esc(STATUS[a.status]) + '</td></tr>';
    }).join('') + '</table>' : '<p class="m">—</p>';
    if ((m.photos || []).length) {
      h1 += '<h2>Photos</h2><div class="ph">' + m.photos.map(function(p, i){
        return '<figure>' + (imgs[i] ? '<img src="' + imgs[i] + '" alt="">' : '') + '<figcaption>Photo ' + (i+1) + (p.caption ? ' : ' + esc(p.caption) : '') + '</figcaption></figure>';
      }).join('') + '</div>';
    }
    h1 += '</body></html>';
    saveFile(slug(m) + '.html', h1);
  }).then(function(){ btn.disabled = false; });
}

/* ---------- Services locaux (version autonome) ---------- */
var PH = {
  db:null,
  open:function(){
    return new Promise(function(res, rej){
      var r = indexedDB.open('crc-photos', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('p'); };
      r.onsuccess = function(){ PH.db = r.result; res(); };
      r.onerror = function(){ rej(r.error); };
    });
  },
  tx:function(mode, fn){
    return new Promise(function(res, rej){
      if (!PH.db) { rej(new Error('db')); return; }
      var t = PH.db.transaction('p', mode), req = fn(t.objectStore('p'));
      t.oncomplete = function(){ res(req && req.result); };
      t.onerror = function(){ rej(t.error); };
    });
  },
  put:function(id, blob){ return PH.tx('readwrite', function(st){ return st.put(blob, id); }); },
  get:function(id){ return PH.tx('readonly', function(st){ return st.get(id); }); },
  del:function(id){ delete urls[id]; return PH.tx('readwrite', function(st){ return st.delete(id); }).catch(function(){}); }
};
var urls = {};
function photoURL(id){
  if (urls[id]) return Promise.resolve(urls[id]);
  return PH.get(id).then(function(b){ return b ? (urls[id] = URL.createObjectURL(b)) : null; }).catch(function(){ return null; });
}
function photoImg(id, alt){
  var img = h('img', {alt:alt, loading:'lazy'});
  photoURL(id).then(function(u){ if (u) img.src = u; });
  return img;
}
function aiJson(prompt, o){
  var key = pref('key'), model = pref('model') || 'claude-sonnet-5-5';
  if (!key) return Promise.reject({code:'no_key'});
  return fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', signal:o && o.signal,
    headers:{'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:model, max_tokens:4000, messages:[{role:'user', content:prompt}]})
  }).then(function(r){ return r.json().then(function(j){ return {r:r, j:j}; }); }).then(function(x){
    if (!x.r.ok) throw {code: x.r.status === 401 ? 'bad_key' : x.r.status === 429 ? 'rate_limited' : 'upstream_error'};
    var t = (x.j.content || []).map(function(b){ return b.text || ''; }).join('');
    var m = t.match(/\{[\s\S]*\}/);
    if (!m) throw {code:'invalid_json'};
    try { return JSON.parse(m[0]); } catch(e) { throw {code:'invalid_json'}; }
  }).catch(function(e){
    if (e && e.name === 'AbortError') throw {code:'cancelled'};
    if (e && e.code) throw e;
    throw {code:'network'};
  });
}
function saveNative(o){
  var cap = window.Capacitor, P = cap && cap.Plugins;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && P && P.Filesystem && P.Share) {
    return P.Filesystem.writeFile({path:o.filename, data:o.data, directory:'CACHE', encoding:'utf8'}).then(function(r){
      return P.Share.share({title:o.filename, url:r.uri});
    });
  }
  var blob = new Blob([o.data], {type:/\.html$/.test(o.filename) ? 'text/html' : 'text/markdown'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = o.filename;
  document.body.append(a); a.click(); a.remove();
  return Promise.resolve();
}

/* ---------- Démarrage ---------- */
function boot(){
  render();
  PH.open().catch(function(){}).then(function(){
    ASSETS = {upload:function(blob){ var id = uid() + uid(); return PH.put(id, blob).then(function(){ return {id:id}; }); }};
    DL = {save:saveNative};
    SAMPLE = {json:aiJson};
    S.mode = 'local'; loadLocal(); S.loading = false; render();
  });
}
boot();
})();
